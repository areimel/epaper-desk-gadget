[platformio]
; Bare `pio run` builds the firmware env only (native is test-only).
; Keep in sync with scripts/list_envs.py (a test checks this).
default_envs = wireless-paper
; Local, uncommitted settings; see platformio_override.ini.example.
extra_configs = platformio_override.ini

[env]
; pioarduino 55.03.312-1 = Arduino-ESP32 3.3.x (latest stable at time of pinning).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
extra_scripts = pre:scripts/platformio_config.py
build_src_filter = +<*>
; Shared by firmware and host tests: the canvas draws with the U8g2 C core.
lib_deps =
    olikraus/U8g2@2.36.18

; Heltec Wireless Paper V1.1: ESP32-S3FN8 (8 MB flash, no PSRAM). Serial and Improv go through the
; CP2102 on UART0, so no USB-CDC flags and no PSRAM flag here.
[env:wireless-paper]
board = esp32-s3-devkitc-1
board_build.arduino.partitions = default_8MB.csv
board_upload.flash_size = 8MB
; GxEPD2: Meshtastic's fork (GPL-3.0) has the drivers for all Wireless Paper panels.
lib_deps =
    ${env.lib_deps}
    https://github.com/meshtastic/GxEPD2.git#c7eb4c3c167cf396ef4f541cc5d4c6aa42f3c46b

[env:native]
platform = native
framework =
test_framework = unity
extra_scripts =
    ${env.extra_scripts}
    post:scripts/native_libs.py
lib_ignore = board, net, store
build_flags = -std=gnu++17 -Itest/stubs
